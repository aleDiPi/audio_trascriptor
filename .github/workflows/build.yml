name: Build Windows
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\trascrittore.iss
      - uses: actions/upload-artifact@v4
        with:
          name: trascrittore-setup
          path: installer/Output/Trascrittore-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: trascrittore-windows
          path: |
            target/release/trascrittore.exe
            config/config.example.toml
            .env.example
      - name: Pubblica release "latest" (solo su main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null; $global:LASTEXITCODE = 0
          $msg = git log -1 --pretty=%B | Out-String
          $flag = if ($msg -match '\[installer\]') { ' [installer]' } else { '' }
          Copy-Item target/release/trascrittore.exe trascrittore.exe
          gh release create latest installer/Output/Trascrittore-Setup.exe trascrittore.exe --target $env:GITHUB_SHA --latest --title "Trascrittore audio - ultima versione" --notes "Build automatica da main (commit $env:GITHUB_SHA).$flag"
