[package]
name = "trascrittore"
version = "0.1.0"
edition = "2021"
description = "Dettatura vocale per Windows: microfono -> Groq Whisper -> Groq LLM -> incolla nel cursore"
license = "MIT"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
cpal = "0.18.2"
hound = "3.5.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "multipart", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"
tray-icon = "0.26.1"

[build-dependencies]
embed-resource = "3"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_Shell"] }
winreg = "0.56.0"
